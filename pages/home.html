<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h1 class="mb-4">Welcome!</h1>
        <p class="lead mb-4" id="welcomeMsg">Loading...</p>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-5 mb-4">
      <h2 class="mb-0">Products</h2>
      <a href="/products.html" class="btn btn-outline-primary btn-sm">View All</a>
    </div>

    <div id="productsLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="productsGrid" class="row"></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { getUser } from "/js/auth.js";

    const user = getUser();
    if (user) {
      document.getElementById("welcomeMsg").textContent =
        `Hello ${user.username}! You are logged in as a ${user.role}.`;
    }

    const productsGrid = document.getElementById("productsGrid");
    const productsLoading = document.getElementById("productsLoading");

    function productImageHtml(product) {
      if (!product.image) {
        return '<div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height:200px;"><span class="text-muted">No Image</span></div>';
      }

      return `<img src="${product.image}" class="card-img-top" alt="${product.name}" style="height:200px;object-fit:cover;" onerror="this.outerHTML='<div class=&quot;card-img-top bg-light d-flex align-items-center justify-content-center&quot; style=&quot;height:200px;&quot;><span class=&quot;text-muted&quot;>No Image</span></div>'">`;
    }

    async function loadProducts() {
      try {
        const res = await fetch("/api/products");
        const data = await res.json();

        productsLoading.classList.add("d-none");

        if (!res.ok || !data.data || data.data.length === 0) {
          productsGrid.innerHTML = '<div class="col-12 text-center text-muted">No products found</div>';
          return;
        }

        productsGrid.innerHTML = "";
        data.data.slice(0, 6).forEach((product) => {
          const col = document.createElement("div");
          col.className = "col-md-4 mb-4";
          col.innerHTML = `
            <div class="card h-100">
              ${productImageHtml(product)}
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${product.name}</h5>
                <p class="card-text text-muted small flex-grow-1">${product.description.substring(0, 80)}${product.description.length > 80 ? "..." : ""}</p>
                <p class="card-text fw-bold">$${product.price.toFixed(2)}</p>
                <a href="/product.html?id=${product.id}" class="btn btn-outline-primary btn-sm">View Details</a>
              </div>
            </div>
          `;
          productsGrid.appendChild(col);
        });
      } catch {
        productsLoading.classList.add("d-none");
        productsGrid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load products</div>';
      }
    }

    loadProducts();
  </script>
</body>
</html>
